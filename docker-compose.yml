version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: agentops-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - agentops-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentops-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.2}
      - MAX_AGENT_ITERATIONS=${MAX_AGENT_ITERATIONS:-3}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-120}
      - DATABASE_URL=sqlite:////app/data/agentops.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - OTEL_SERVICE_NAME=agentops-platform
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ENVIRONMENT=production
      - ALLOW_MOCK_FALLBACK=true
    volumes:
      - agentops-data:/app/data
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - agentops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agentops-network

networks:
  agentops-network:
    driver: bridge

volumes:
  agentops-data:
    driver: local
