[project]
name = "agentops-code-intelligence"
version = "0.1.0"
description = "AgentOps: Multi-Agent Research, Evaluation and Observability Platform powered by Google ADK, Gemini, OpenTelemetry and Jaeger"
readme = "README.md"
authors = [
    { name = "Harsh Sharma", email = "harsh.sharma@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.14.0",
    "google-genai>=2.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_gemini: Live tests calling Google AI Studio Gemini API (requires GEMINI_API_KEY)"
]
